name: CI

on:
  push:
    branches: [main]
    # Keep the full validation matrix on every tag, including release tags.
    tags: ['**']
  pull_request:
  workflow_dispatch:

# Runs stay independent: new commits do not cancel running or queued checks.

permissions:
  contents: read

jobs:
  changes:
    name: Determine required checks
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.paths.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/ci_changes.py

  test:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.required != 'false') }}
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install --editable '.[dev]'
      - name: Run tests
        run: python scripts/verify.py unit

  test-312:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    name: Test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install --editable '.[dev]'
      - name: Run tests
        run: python scripts/verify.py unit

  test-313:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    name: Test (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install --editable '.[dev]'
      - name: Run tests
        run: python scripts/verify.py unit

  test-314:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    name: Test (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install --editable '.[dev]'
      - name: Run tests
        run: python scripts/verify.py unit

  e2e:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    name: Browser workflow (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and browser test dependencies
        run: python -m pip install --upgrade pip && python -m pip install --editable '.[dev]'
      - name: Resolve Playwright version
        id: pw-version
        run: echo "version=$(python -m pip show playwright | awk '/^Version:/ {print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Run browser tests
        run: python scripts/verify.py browser

  macos:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    # macOS-specific behavior (Photos-library refusal, Finder reveal, Trash)
    # is only exercised here; Linux never sees it.
    name: macOS (Python 3.13)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install ffmpeg
        run: brew install ffmpeg
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install --editable '.[dev,human]'
      - name: Run tests
        run: python scripts/verify.py unit
      - name: Build unsigned macOS launcher
        run: python scripts/verify.py macos

  quality-and-package:
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.required != 'false') }}
    name: Lint and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development tools
        run: python -m pip install --upgrade pip && python -m pip install 'ruff>=0.9.0' 'build>=1.2.0'
      - name: Run Ruff
        run: python scripts/verify.py lint
      - name: Build and validate distributions
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: python scripts/verify.py package
