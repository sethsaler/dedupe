name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install --editable '.[dev]'
      - name: Run tests
        run: pytest -q

  e2e:
    name: Browser workflow (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and browser test dependencies
        run: python -m pip install --upgrade pip && python -m pip install --editable '.[dev]'
      - name: Resolve Playwright version
        id: pw-version
        run: echo "version=$(python -m pip show playwright | awk '/^Version:/ {print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Run browser tests
        run: pytest -q -m e2e

  macos:
    # macOS-specific behavior (Photos-library refusal, Finder reveal, Trash)
    # is only exercised here; Linux never sees it.
    name: macOS (Python 3.13)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install ffmpeg
        run: brew install ffmpeg
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install --editable '.[dev,human]'
      - name: Run tests
        run: pytest -q

  quality-and-package:
    name: Lint and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development tools
        run: python -m pip install --upgrade pip && python -m pip install '.[dev]'
      - name: Run Ruff
        run: ruff check src tests
      - name: Build distributions
        run: python -m build
      - name: Validate wheel installation
        run: |
          python -m venv /tmp/dedupe-wheel
          /tmp/dedupe-wheel/bin/python -m pip install dist/*.whl
          /tmp/dedupe-wheel/bin/python -m pip check
          /tmp/dedupe-wheel/bin/dedupe --help >/dev/null
